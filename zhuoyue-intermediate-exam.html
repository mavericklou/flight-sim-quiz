  var btn = document.getElementById('back-top');
  if (btn) btn.classList.toggle('show', window.scrollY > 400);
});
function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

var DATA=JSON.parse(document.getElementById('qdata').textContent);
var SKEY='zhuoyue_exam_intermediate_state_v1', HKEY='zhuoyue_exam_intermediate_history_v1';
var state=null;
function loadState(){ try{return JSON.parse(sessionStorage.getItem(SKEY)||'null');}catch(e){return null;} }
function saveState(){ try{sessionStorage.setItem(SKEY,JSON.stringify(state));}catch(e){} }
function sample(){
  var a=DATA.map(function(_,i){return i;});
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}
  return a.slice(0,10);
}
if(!state || !state.ids || state.ids.length!==10) state={ids:sample(),chosen:{},submitted:false,ts:Date.now()};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function render(){
  var html='';
  state.ids.forEach(function(qi,pos){
    var q=DATA[qi], chosen=state.chosen[qi]||'';
    var diff=q.diff==='中级'?'<span class="q-diff mid">中级</span>':'<span class="q-diff">初级</span>';
    html+='<div class="q-card" data-pos="'+pos+'"><div class="q-top"><span class="q-num">'+(pos+1)+'</span>'+diff+'<span class="q-status"></span></div><div class="q-text">'+esc(q.text)+'</div>';
    if(q.img) html+='<img class="qimg" src="'+esc(q.img)+'" alt="题目配图">';
    if(q.warn) html+='<div class="q-warn">'+esc(q.warn)+'</div>';
    q.opts.forEach(function(o){
      var cls='opt';
      if(state.submitted){ if(o.correct) cls+=' opt-correct'; if(chosen===o.letter && !o.correct) cls+=' opt-wrong'; }
      else if(chosen===o.letter) cls+=' opt-selected';
      html+='<div class="'+cls+'" data-letter="'+o.letter+'" onclick="pickOpt(this)">'+o.letter+'. '+esc(o.text)+'</div>';
    });
    html+='<div class="ans-area"><div class="ans-reveal'+(state.submitted?' show':'')+'">';
    if(state.submitted) html+= (chosen===q.letter?'✓ 答对了！':'✗ 答错了！')+' 正确答案：<span class="correct-text">'+q.letter+'（'+esc(q.answer)+'）</span>';
    html+='</div></div></div>';
  });
  document.getElementById('exam-grid').innerHTML=html;
  updateScore();
}
function pickOpt(el){
  if(state.submitted) return;
  var card=el.closest('.q-card'), pos=parseInt(card.dataset.pos,10), qi=state.ids[pos];
  state.chosen[qi]=el.dataset.letter; saveState(); render();
}
function updateScore(){
  var answered=0, ok=0, no=0;
  state.ids.forEach(function(qi){
    if(state.submitted){ if(state.chosen[qi]===DATA[qi].letter) ok++; else no++; }
    else if(state.chosen[qi]) answered++;
  });
  document.getElementById('score-pct').textContent=state.submitted?Math.round(ok/10*100)+'%':'--%';
  document.getElementById('score-ok').textContent='答对 '+ok;
  document.getElementById('score-no').textContent='答错 '+(state.submitted?no:0);
  document.getElementById('score-extra').textContent=state.submitted?'共 10 题':'已答 '+answered+' ／ 共 10 题';
  document.getElementById('btn-submit').disabled=state.submitted || !state.ids.every(function(qi){return !!state.chosen[qi];});
  document.getElementById('btn-new').style.display=state.submitted?'':'none';
}
function submitExam(){
  if(state.submitted) return;
  state.submitted=true; state.ts=Date.now(); saveState();
  var ok=0,no=0;
  state.ids.forEach(function(qi){ if(state.chosen[qi]===DATA[qi].letter) ok++; else no++; });
  var hist=[]; try{hist=JSON.parse(localStorage.getItem(HKEY)||'[]');}catch(e){}
  var d=new Date(), p=function(n){return n<10?'0'+n:''+n;};
  hist.push({time:d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()),correct:ok,wrong:no,pct:Math.round(ok/10*100)});
  try{localStorage.setItem(HKEY,JSON.stringify(hist));}catch(e){}
  document.getElementById('summary').className='summary';
  document.getElementById('summary').innerHTML='<strong>本次成绩：答对 '+ok+' 题，答错 '+no+' 题，正确率 '+Math.round(ok/10*100)+'%</strong>　（历史成绩记录已更新）';
  render(); renderHistory();
}
function newExam(){ state={ids:sample(),chosen:{},submitted:false,ts:Date.now()}; saveState();
  document.getElementById('summary').className='summary hidden'; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function renderHistory(){
  var hist=[]; try{hist=JSON.parse(localStorage.getItem(HKEY)||'[]');}catch(e){}
  var box=document.getElementById('history-content');
  if(!hist.length){ box.innerHTML='<div class="history-empty">暂无记录——完成一次考试并交卷后会在这里留下成绩。</div>'; return; }
  var h='<table><tr><th>时间</th><th>答对</th><th>答错</th><th>正确率</th></tr>';
  hist.slice().reverse().forEach(function(r){ h+='<tr><td>'+esc(r.time)+'</td><td>'+r.correct+'</td><td>'+r.wrong+'</td><td><strong>'+r.pct+'%</strong></td></tr>'; });
  box.innerHTML=h+'</table>';
}
render(); renderHistory();
</script>
</body>
</html>
